<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.15" />
    </filter>
  </defs>

  <!-- Globe Outer Circle -->
  <circle cx="250" cy="180" r="145" fill="#ffffff" stroke="#0072bc" stroke-width="6.5" />

  <!-- Equator Line -->
  <line x1="105" y1="180" x2="395" y2="180" stroke="#0072bc" stroke-width="6" />

  <!-- Upper Latitude Arc -->
  <path d="M 120 120 C 180 148, 320 148, 380 120" fill="none" stroke="#0072bc" stroke-width="5" />

  <!-- Lower Latitude Arc -->
  <path d="M 120 240 C 180 212, 320 212, 380 240" fill="none" stroke="#0072bc" stroke-width="5" />

  <!-- Prime Meridian (Center Vertical) -->
  <line x1="250" y1="35" x2="250" y2="325" stroke="#0072bc" stroke-width="6" />

  <!-- Inner Meridians -->
  <path d="M 250 35 C 185 35, 185 325, 250 325" fill="none" stroke="#0072bc" stroke-width="5" />
  <path d="M 250 35 C 315 35, 315 325, 250 325" fill="none" stroke="#0072bc" stroke-width="5" />

  <!-- Outer Meridians -->
  <path d="M 250 35 C 130 35, 130 325, 250 325" fill="none" stroke="#0072bc" stroke-width="5" />
  <path d="M 250 35 C 370 35, 370 325, 250 325" fill="none" stroke="#0072bc" stroke-width="5" />

  <!-- Vietnam Map (Blue Silhouette) -->
  <g fill="#0277bd" stroke="#0277bd" stroke-linejoin="round" stroke-linecap="round">
    <!-- North Vietnam -->
    <path d="M 215 65 C 228 50, 260 50, 275 62 C 285 75, 275 90, 265 98 C 255 106, 245 114, 240 125 C 235 136, 237 145, 240 155 C 242 162, 236 168, 228 160 C 220 150, 222 135, 225 125 C 220 110, 210 98, 206 82 C 204 70, 208 70, 215 65 Z" stroke-width="2" />
    <!-- Central S-Curve -->
    <path d="M 240 155 C 248 168, 258 182, 264 198 C 270 214, 272 230, 268 245 C 264 256, 252 268, 244 280 C 236 292, 234 302, 230 312 C 224 318, 218 312, 222 300 C 226 285, 236 270, 244 254 C 252 238, 254 222, 250 206 C 246 190, 238 175, 234 165 C 232 158, 238 152, 240 155 Z" stroke-width="2" />
    <!-- South Vietnam -->
    <path d="M 244 280 C 256 280, 270 288, 274 300 C 276 312, 262 324, 248 326 C 234 328, 222 324, 216 312 C 212 300, 222 288, 232 282 C 238 278, 242 278, 244 280 Z" stroke-width="2" />
    <!-- Islands -->
    <circle cx="300" cy="180" r="4.5" />
    <circle cx="295" cy="245" r="4" />
    <circle cx="305" cy="258" r="4" />
    <circle cx="205" cy="305" r="4" />
  </g>

  <!-- Red Star at Hanoi -->
  <polygon points="246,75 250,84 260,84 252,90 255,100 246,94 238,100 241,90 233,84 243,84" fill="#e52421" />

  <!-- Bold TS Monogram (Red with clean white outline) -->
  <g filter="url(#shadow)">
    <!-- Letter T -->
    <text x="185" y="215" font-family="'Times New Roman', 'Georgia', 'Playfair Display', serif" font-size="130" font-weight="900" fill="#e31e24" stroke="#ffffff" stroke-width="8" paint-order="stroke fill" text-anchor="middle">T</text>
    <!-- Letter S -->
    <text x="305" y="222" font-family="'Times New Roman', 'Georgia', 'Playfair Display', serif" font-size="130" font-weight="900" fill="#e31e24" stroke="#ffffff" stroke-width="8" paint-order="stroke fill" text-anchor="middle">S</text>
  </g>

  <!-- TRUONG SON COMPANY Text -->
  <text x="250" y="380" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="32" font-weight="900" fill="#0065b3" text-anchor="middle" letter-spacing="1.5">TRUONG SON COMPANY</text>
</svg>
